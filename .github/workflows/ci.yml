name: Integration Tests

# This workflow runs automatically whenever code is pushed to any branch,
# or when a pull request is opened/updated against the main branch.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    # 1. Check out our wireguard-go repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Install prerequisites (Go is usually pre-installed on GitHub runners, but we ensure packages are there)
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl git iproute2 iputils-ping wireguard-tools socat xxd jq python3 python3-pip python3-yaml supervisor procps tar gzip tcpdump netcat-openbsd iperf3

    # 3. Download and build the SCION repository (just like we did locally!)
    - name: Setup SCION Source
      run: |
        git clone https://github.com/scionproto/scion.git /home/runner/scion
        cd /home/runner/scion
        go build -o bin/ ./router/... ./control/... ./dispatcher/... ./daemon/... ./scion/... ./scion-pki/...
        python3 -m pip install -r env/pip3/requirements.txt

    # 4. Install Scitra-TUN components
    - name: Install Scitra-TUN
      run: |
        sudo curl -fsSL https://lcschulz.de/scion/gpg/scion-lcschulz -o /usr/share/keyrings/scion-lcschulz.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/scion-lcschulz.gpg] https://lcschulz.de/scion/apt $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/scion-lcschulz.list
        sudo apt-get update
        sudo apt-get install -y scitra-tun scion++-tools

    # 5. Run the Integration Tests
    # We export SCION_DIR to point to the folder where we cloned SCION in step 3
    - name: Run Integration Test Suite
      env:
        SCION_DIR: /home/runner/scion
      run: |
        cd integration-tests
        sudo -E ./run_all.sh
