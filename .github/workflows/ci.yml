name: CI Pipeline

on:
  push:
    branches: [ "feature/integration-tests-and-ci" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: true

    - name: Run Unit Tests
      run: go test -v ./...

    - name: Build wireguard-go
      run: go build -v -o wireguard-go .

    - name: Upload wireguard-go Binary
      uses: actions/upload-artifact@v4
      with:
        name: wireguard-go-binary
        path: wireguard-go
        retention-days: 1

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download wireguard-go Binary
      uses: actions/download-artifact@v4
      with:
        name: wireguard-go-binary
        path: .

    - name: Make Binary Executable
      run: chmod +x wireguard-go

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl git iproute2 iputils-ping wireguard-tools socat xxd jq python3 python3-pip python3-yaml supervisor procps tar gzip tcpdump netcat-openbsd iperf3

    - name: Cache SCION
      id: cache-scion
      uses: actions/cache@v4
      with:
        path: /home/runner/scion
        key: ${{ runner.os }}-scion-v1

    - name: Setup SCION Source
      if: steps.cache-scion.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/scionproto/scion.git /home/runner/scion
        cd /home/runner/scion
        go build -o bin/ ./router/... ./control/... ./dispatcher/... ./daemon/... ./scion/... ./scion-pki/...
        python3 -m pip install --break-system-packages -r tools/env/pip3/requirements.txt
        # scion.sh expects these tools in the bin/ folder
        ln -sf ../tools/topogen.py bin/topogen
        ln -sf $(which supervisord) bin/supervisord
        ln -sf $(which supervisorctl) bin/supervisorctl

    - name: Install Scitra-TUN
      run: |
        sudo curl -fsSL https://lcschulz.de/scion/gpg/scion-lcschulz -o /usr/share/keyrings/scion-lcschulz.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/scion-lcschulz.gpg] https://lcschulz.de/scion/apt $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/scion-lcschulz.list
        sudo apt-get update
        sudo apt-get install -y scitra-tun scion++-tools

    - name: Start Test Environment
      env:
        SCION_DIR: /home/runner/scion
        SKIP_WG_BUILD: "1"
      run: |
        cd testenvironment
        sudo -E env "PATH=$PATH" "SKIP_WG_BUILD=$SKIP_WG_BUILD" ./testenvironment.bash up

    - name: Run Integration Test Suite
      env:
        SCION_DIR: /home/runner/scion
      run: |
        cd integration-tests
        sudo -E env "PATH=$PATH" ./run_all.sh
